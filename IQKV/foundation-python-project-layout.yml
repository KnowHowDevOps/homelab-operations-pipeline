# =====================================================================================
# Python Project Layout - Drone CI/CD Pipeline
# =====================================================================================
# Pipeline Flow:
#   1. VerifyCode                       - Code quality, tests, and static analysis
#   2. PublishArtifacts                 - Python distributions (wheel + sdist) to PyPI index
#   3. PublishDockerImage               - Container images built from the repo Dockerfile
#   4. DeployWorkInProgress             - Wip branch deployments to SIT environment
#   5. RollbackWorkInProgress           - Rollback wip deployments
#   6. PromoteFeatureDeployment         - Feature branch deployments to SIT environment
#   7. RollbackFeatureDeployment        - Rollback feature deployments
#   8. PromoteDeployment                - Release deployments to staging/production
#   9. RollbackDeployment               - Rollback release deployments
#   10. ReleasePackage                  - Automated version management
#
# Toolchain: uv (dependency management), ruff (lint + format), mypy (types),
#            pytest (tests + coverage), SonarQube + bandit (static analysis),
#            release-it (changelog/releases).
# =====================================================================================

# ============================================================================
# Pipeline 1: VerifyCode
# ============================================================================
kind: pipeline
name: VerifyCode
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    include:
      - refs/heads/dev
      - refs/heads/feature/*
      - refs/heads/rfc/*
      - refs/heads/poc/*
      - refs/heads/bugfix/*
      - refs/heads/improvement/*
      - refs/heads/prerelease/*
      - refs/heads/library/*
      - refs/heads/hotfix/*
      - refs/heads/*.*.x
      - refs/tags/*

volumes:
  - name: uv-cache
    host:
      path: /app/.uv-cache
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Step 1: Code Coverage Gate
  # --------------------------------------------------------------------------
  - name: code-coverage-gate
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: uv-cache
        path: /root/.cache/uv
      - name: pnpm-store
        path: /root/.pnpm-store
    environment:
      UV_CACHE_DIR: /root/.cache/uv
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - python --version
      - uv --version
      # - yamllint .
      - npm config set registry https://registry.npmjs.org/
      - pnpm install --frozen-lockfile --ignore-scripts && pnpm formatter:check
      - uv sync --frozen
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy
      - uv run pytest --cov --cov-report=xml --cov-report=term-missing

  # --------------------------------------------------------------------------
  # Step 2: Static Analysis Gate
  # --------------------------------------------------------------------------
  - name: static-analysis-gate
    depends_on:
      - code-coverage-gate
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: uv-cache
        path: /root/.cache/uv
      - name: pnpm-store
        path: /root/.pnpm-store
    environment:
      UV_CACHE_DIR: /root/.cache/uv
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
      SONAR_HOST:
        from_secret: SONAR_HOST
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
    commands:
      - command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv sync --frozen
      # SonarQube analysis with quality gate (blocks on failure)
      - >-
        sonar-scanner
        -Dsonar.projectKey=${DRONE_REPO_OWNER}:${DRONE_REPO_NAME}
        -Dsonar.projectName=${DRONE_REPO_OWNER}:${DRONE_REPO_NAME}
        -Dsonar.sources=src
        -Dsonar.tests=tests
        -Dsonar.python.coverage.reportPaths=coverage.xml
        -Dsonar.qualitygate.wait=true
        -Dsonar.qualitygate.timeout=300
        -Dsonar.host.url=$SONAR_HOST
        -Dsonar.token=$SONAR_TOKEN
      # bandit security scan
      - uvx bandit -r src -q
      # vulture dead-code scan (non-blocking)
      - uvx vulture src tests --min-confidence 80 || true

  # --------------------------------------------------------------------------
  # Step 3: Slack Notification (Failure Only)
  # --------------------------------------------------------------------------
  - name: notify-slack-on-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        :red_circle: :thunder_cloud_and_rain: {{build.link}} ({{build.branch}}) by {{build.author}}
    when:
      status:
        - failure
    depends_on:
      - code-coverage-gate
      - static-analysis-gate

---
# ============================================================================
# Pipeline 2: PublishArtifacts
# ============================================================================
kind: pipeline
name: PublishArtifacts
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    - refs/heads/dev
    - refs/heads/prerelease/*
    - refs/heads/*.*.x
    - refs/tags/*

depends_on:
  - VerifyCode

volumes:
  - name: uv-cache
    host:
      path: /app/.uv-cache
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Step 1: Publish SNAPSHOT Distribution
  # --------------------------------------------------------------------------
  - name: publish-snapshot-dist
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: uv-cache
        path: /root/.cache/uv
    environment:
      UV_CACHE_DIR: /root/.cache/uv
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv build
      - >-
        uv publish
        --publish-url https://know-how.nexus/repository/pypi-snapshots/
        --username $NEXUS_DEPLOYER_USERNAME
        --password $NEXUS_DEPLOYER_PASSWORD
    when:
      branch:
        include:
          - "dev"
          - "prerelease/*"
          - "*.*.x"

  # --------------------------------------------------------------------------
  # Step 2: Publish Release Distribution
  # --------------------------------------------------------------------------
  - name: publish-release-dist
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: uv-cache
        path: /root/.cache/uv
    environment:
      UV_CACHE_DIR: /root/.cache/uv
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv build
      - >-
        uv publish
        --publish-url https://know-how.nexus/repository/pypi-releases/
        --username $NEXUS_DEPLOYER_USERNAME
        --password $NEXUS_DEPLOYER_PASSWORD
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Step 3: Create GitHub Release
  # --------------------------------------------------------------------------
  - name: create-github-release
    depends_on:
      - publish-release-dist
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: pnpm-store
        path: /root/.pnpm-store
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_API_ACCESS_TOKEN
    commands:
      - git checkout -b release
      - npm config set registry https://registry.npmjs.org/
      - pnpm install --frozen-lockfile --ignore-scripts && git config --unset core.hooksPath
      - wget -O ./.release-it.json https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/release-it/release.json
      - git fetch --tags
      - release-it --ci --no-increment -VV
      - git status
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Step 4: Slack Notification
  # --------------------------------------------------------------------------
  - name: notify-slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        {{#success build.status}}
         :large_green_circle: :package: *${DRONE_COMMIT_MESSAGE}*
         {{build.link}} ({{build.branch}}) by {{build.author}}
        {{else}}
         :red_circle: :package: {{build.link}} ({{build.branch}}) by {{build.author}}
        {{/success}}
    when:
      status:
        - failure
        - success
    depends_on:
      - publish-snapshot-dist
      - publish-release-dist

---
# ============================================================================
# Pipeline 3: PublishDockerImage
# ============================================================================
# Builds the container image from the repository's own Dockerfile (multi-stage,
# non-root runtime). No external Dockerfile template is fetched.
# ============================================================================
kind: pipeline
name: PublishDockerImage
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    include:
      - refs/heads/wip
      - refs/heads/feature/*
      - refs/tags/*

steps:
  # --------------------------------------------------------------------------
  # Step 1: Build WIP Branch Docker Image
  # --------------------------------------------------------------------------
  - name: build-wip-container
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./
      username:
        from_secret: SVC_DOCKER_HUB_PUSH_USERNAME
      password:
        from_secret: SVC_DOCKER_HUB_PUSH_PASSWORD
      repo: ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}
      # registry: know-how.download
      force_tag: true
      cache: true
      cache_from:
        - ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}-cache
      storage_driver: vfs
      tags:
        - ${DRONE_BRANCH}
      purge: true
    when:
      branch:
        include:
          - "wip"

  # --------------------------------------------------------------------------
  # Step 2: Build Feature Branch Docker Image
  # --------------------------------------------------------------------------
  - name: build-container-with-feature
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./
      username:
        from_secret: SVC_DOCKER_HUB_PUSH_USERNAME
      password:
        from_secret: SVC_DOCKER_HUB_PUSH_PASSWORD
      repo: ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}
      # registry: know-how.download
      force_tag: true
      cache: true
      cache_from:
        - ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}-cache
      storage_driver: vfs
      tags:
        - ${DRONE_BRANCH:8} # Strips 'feature/' prefix
    when:
      branch:
        include:
          - "feature/*"

  # --------------------------------------------------------------------------
  # Step 3: Build Release Docker Image
  # --------------------------------------------------------------------------
  - name: build-container-release
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./
      username:
        from_secret: SVC_DOCKER_HUB_PUSH_USERNAME
      password:
        from_secret: SVC_DOCKER_HUB_PUSH_PASSWORD
      repo: ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}
      # registry: know-how.download
      force_tag: true
      cache: true
      cache_from:
        - ${DRONE_REPO_OWNER,,}/${DRONE_REPO_NAME}-cache
      storage_driver: vfs
      tags:
        - ${DRONE_TAG}
    when:
      ref:
        - "refs/tags/*"

---
# ============================================================================
# Pipeline 4: DeployWorkInProgress
# ============================================================================
kind: pipeline
name: DeployWorkInProgress
type: docker
trigger:
  event:
    - push
    - tag
  ref:
    - refs/heads/wip

depends_on:
  - PublishDockerImage

steps:
  # --------------------------------------------------------------------------
  # Deploy to SIT Environment
  # --------------------------------------------------------------------------
  - name: deploy
    image: cicdtools/pipeline-runner
    pull: never
    environment:
      HELM_CHARTS_REPOSITORY:
        from_secret: HELM_CHARTS_REPOSITORY
      INFRA_POSTGRESQL_PASSWORD:
        from_secret: INFRA_POSTGRESQL_PASSWORD
      INFRA_RABBITMQ_PASSWORD:
        from_secret: INFRA_RABBITMQ_PASSWORD
      SMTP_USERNAME:
        from_secret: SMTP_USERNAME
      SMTP_PASSWORD:
        from_secret: SMTP_PASSWORD
    commands:
      - git clone $${HELM_CHARTS_REPOSITORY} charts && cd charts/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}
      - kubectl version --output=yaml
      - kubectl config use-context hst
      - helm uninstall --wait --timeout 2m ${DRONE_REPO_NAME} -n iqkv-sit-env || true
      - |
        helm upgrade --install --rollback-on-failure --wait --timeout 5m ${DRONE_REPO_NAME} ./ \
          --values ./values.yaml \
          --values ./values-sit.yaml \
          --set image.tag=${DRONE_BRANCH} \
          --set infraServices.postgresql.password=$${INFRA_POSTGRESQL_PASSWORD} \
          --set infraServices.rabbitmq.password=$${INFRA_RABBITMQ_PASSWORD} \
          --set config.mail.username=$${SMTP_USERNAME} \
          --set config.mail.password=$${SMTP_PASSWORD} \
          --namespace iqkv-sit-env \
          --create-namespace

  # --------------------------------------------------------------------------
  # Slack Notification
  # --------------------------------------------------------------------------
  - name: notify-slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        {{#success build.status}}
         :large_green_circle: :ship: *${DRONE_COMMIT_MESSAGE}*
         {{build.link}} ({{build.branch}}) by {{build.author}}
        {{else}}
         :red_circle: :anchor: {{build.link}} ({{build.branch}}) by {{build.author}}
        {{/success}}
    when:
      status:
        - failure
        - success
    depends_on:
      - deploy

