# =====================================================================================
# Drone CI/CD Pipeline — VPS
# =====================================================================================
# Pipeline Flow:
#   1. build-application — pnpm install + pnpm docs:build (produces docs/.vitepress/dist/)
#   2. build-container   — docker build via socket, tags image :wip, no push
#   3. deploy            — docker compose restarts cloud-vps-20-foundation-docs-website
# =====================================================================================

# ============================================================================
# Pipeline 1: BuildImage
# ============================================================================
# Builds the VitePress documentation site, packages it into a Nginx Docker image,
# and restarts the service in the running VPS compose stack.
# Triggers: Push to dev branch only
# ============================================================================
kind: pipeline
name: BuildImage
type: docker

trigger:
  event:
    - push
  branch:
    - dev

node:
  environment: demoops

# Ephemeral volume for pnpm package cache shared across steps
volumes:
  - name: pnpm-store
    temp: {}

steps:
  # --------------------------------------------------------------------------
  # Step 1: Build Application
  # --------------------------------------------------------------------------
  # Runs pnpm install + pnpm docs:build using the standard Node image.
  # Corepack activates the pinned pnpm version from packageManager field.
  # Produces docs/.vitepress/dist/ in the Drone workspace (/drone/src).
  # The workspace is automatically shared with all subsequent steps.
  # --------------------------------------------------------------------------
  - name: build-application
    image: node:22-alpine
    volumes:
      - name: pnpm-store
        path: /root/.pnpm-store
    environment:
      COREPACK_ENABLE_STRICT: "0"
    commands:
      - corepack enable
      - corepack prepare pnpm@10.33.2 --activate
      - pnpm config set store-dir /root/.pnpm-store
      - pnpm install
      - pnpm docs:build

  # --------------------------------------------------------------------------
  # Step 2: Build Container Image
  # --------------------------------------------------------------------------
  # Copies pre-built docs/.vitepress/dist/ into a standard Nginx image.
  # Tagged :wip. Builds directly via the host Docker socket — no push.
  # Socket and /app are injected by DRONE_RUNNER_VOLUMES on the runner.
  # --------------------------------------------------------------------------
  - name: build-container
    image: docker:cli
    depends_on:
      - build-application
    commands:
      - docker build
          -f Dockerfile
          --build-arg BASE_IMAGE=nginx:1.27-alpine
          --build-arg VCS_REFERENCE=${DRONE_COMMIT}
          --build-arg BUILD_VERSION_REFERENCE=${DRONE_BRANCH}
          -t iqkv/foundation-docs-website:wip
          .

  # --------------------------------------------------------------------------
  # Step 3: Deploy — restart service via Compose
  # --------------------------------------------------------------------------
  # Recreates the container from the freshly built :wip image.
  # Socket and /app are injected by DRONE_RUNNER_VOLUMES on the runner.
  # --------------------------------------------------------------------------
  - name: deploy
    image: docker:cli
    depends_on:
      - build-container
    commands:
      - docker compose -f /app/compose.yaml -p app up -d --no-build cloud-vps-20-foundation-docs-website
