# =====================================================================================
# Drone CI/CD Pipeline — VPS
# =====================================================================================
# Pipeline Flow (BuildImage):
#   1. build-container — multi-stage docker build (Maven inside), tags image :wip, no push
#   2. deploy          — docker compose restarts cloud-vps-20-cms-service
#
# Pipeline Flow (BuildNativeImage):
#   1. build-native    — GraalVM native-image build via Dockerfile.native, tags :native, no push
#   2. deploy-native   — docker compose restarts cloud-vps-20-cms-service with :native image
#   Trigger: push to branch native-experiment (manual experiment trigger)
# =====================================================================================

# ============================================================================
# Pipeline 1: BuildImage (JVM — standard path)
# ============================================================================
# Builds the Spring Boot JAR inside a multi-stage Docker build (no host Maven needed),
# packages it into a JRE runtime image, and restarts the service in the VPS stack.
# Triggers: Push to dev branch only
# ============================================================================
kind: pipeline
name: BuildImage
type: docker

trigger:
  event:
    - push
  branch:
    - dev

node:
  environment: demoops

steps:
  # --------------------------------------------------------------------------
  # Step 1: Build Container Image
  # --------------------------------------------------------------------------
  # Multi-stage build: stage 1 runs Maven inside eclipse-temurin:25-jdk-alpine,
  # stage 2 copies extracted layers into a lean JRE runtime image.
  # Tagged :wip. Builds directly via the host Docker socket — no push.
  # Socket and /app are injected by DRONE_RUNNER_VOLUMES on the runner.
  # --------------------------------------------------------------------------
  - name: build-container
    image: docker:cli
    commands:
      - docker build
          -f Dockerfile
          --build-arg VCS_REFERENCE=${DRONE_COMMIT}
          --build-arg BUILD_VERSION_REFERENCE=${DRONE_BRANCH}
          -t iqkv/foundation-cms-service:wip
          .

  # --------------------------------------------------------------------------
  # Step 2: Deploy — restart service via Compose
  # --------------------------------------------------------------------------
  # Recreates the container from the freshly built :wip image.
  # Socket and /app are injected by DRONE_RUNNER_VOLUMES on the runner.
  # --------------------------------------------------------------------------
  - name: deploy
    image: docker:cli
    depends_on:
      - build-container
    commands:
      - docker compose -f /app/compose.yaml -p app up -d --no-build cloud-vps-20-cms-service

---
# ============================================================================
# Pipeline 2: BuildNativeImage (GraalVM — experimental)
# ============================================================================
# Builds a GraalVM native binary using Dockerfile.native (production Maven profile).
# Uses the -Pproduction flag which activates spring-boot process-aot +
# native-maven-plugin compile-no-fork.
#
# WARNING: This build requires ~6-8 GB RAM and takes 5-15 minutes.
# The runner must have sufficient memory — check before triggering.
#
# Triggers: Push to native-experiment branch only (manual experiment)
# ============================================================================
kind: pipeline
name: BuildNativeImage
type: docker

trigger:
  event:
    - push
  branch:
    - native-experiment

node:
  environment: demoops

steps:
  # --------------------------------------------------------------------------
  # Step 1: Build native image
  # --------------------------------------------------------------------------
  # Uses Dockerfile.native which:
  #   - Builder: ghcr.io/graalvm/native-image-community:25 + Maven -Pproduction
  #   - Runtime: gcr.io/distroless/base-debian12 (no JVM, ~50MB image)
  #
  # Build args are passed through for image metadata only (AOT build ignores them).
  # No cache from JVM build — GraalVM layer is a completely separate image.
  #
  # If the build fails with missing reflection hints, inspect the native-image
  # build log for "Warning: Reflection method invoked on non-registered class"
  # and add the missing class to src/main/resources/META-INF/native-image/reflect-config.json.
  # --------------------------------------------------------------------------
  - name: build-native
    image: docker:cli
    commands:
      - docker build
          -f Dockerfile.native
          --build-arg VCS_REFERENCE=${DRONE_COMMIT}
          --build-arg BUILD_VERSION_REFERENCE=${DRONE_BRANCH}
          --progress=plain
          -t iqkv/foundation-cms-service:native
          .

  # --------------------------------------------------------------------------
  # Step 2: Smoke test — verify the binary starts up
  # --------------------------------------------------------------------------
  # Runs the native binary with a minimal env and waits for actuator/health.
  # On failure the container log is printed for debugging.
  # The container is always removed regardless of outcome.
  # --------------------------------------------------------------------------
  - name: smoke-test
    image: docker:cli
    depends_on:
      - build-native
    commands:
      - |
        docker run -d --name cms-native-smoke
          -e SPRING_PROFILES_ACTIVE=test
          -e DB_HOST=localhost
          -e DB_PORT=5432
          -e DB_NAME=cmsservice
          -e DB_USERNAME=svc_cms_dba
          -e DB_PASSWORD=svc_cms_dba
          -e RABBITMQ_HOST=localhost
          -e RABBITMQ_PORT=5672
          -e RABBITMQ_USERNAME=guest
          -e RABBITMQ_PASSWORD=guest
          -e JWT_PUBLIC_KEY_PATH=classpath:keys/public.pem
          -e ROLLOUT_MODE=SINGLE_TENANT
          -e MANAGEMENT_SERVER_PORT=8081
          iqkv/foundation-cms-service:native
      - sleep 20
      - docker logs cms-native-smoke
      - docker stop cms-native-smoke || true
      - docker rm cms-native-smoke || true

  # --------------------------------------------------------------------------
  # Step 3: Deploy native — swap compose service to :native image
  # --------------------------------------------------------------------------
  # Updates compose.yaml image tag reference and restarts the service.
  # Only runs if smoke test passes.
  # To revert to JVM: push to dev branch to rebuild :wip and redeploy.
  # --------------------------------------------------------------------------
  - name: deploy-native
    image: docker:cli
    depends_on:
      - smoke-test
    commands:
      - docker compose -f /app/compose.yaml -p app up -d --no-build cloud-vps-20-cms-service
