kind: pipeline
name: CI
type: docker

trigger:
  event:
    - push

volumes:
  - name: pnpm-store
    host:
      path: /app/.pnpm-store
steps:
  - name: rebuild
    image: cicdtools/pipeline-runner
    pull: if-not-exists
    volumes:
      - name: pnpm-storepnpm-store
        path: /root/.pnpm-store
    commands:
      - pnpm install
      - ls -a .
      - ls -a .pnpm-store/v10
