kind: pipeline
name: CI
type: docker

trigger:
  event:
    - push

volumes:
  - name: maven-cache
    host:
      path: /app/.m2
steps:
  - name: build
    image: cicdtools/pipeline-runner
    pull: if-not-exists
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - printenv
      - pnpm install
      - ls -a .
      - ls -a .pnpm-store/v10
