
# ============================================================================
# Pipeline: BuildImage
# ============================================================================
# Same flow as BuildImage but targets the VPS Demoops stack.
# Triggers: Push to dev branch only
# ============================================================================
kind: pipeline
name: BuildImage
type: docker

trigger:
  event:
    - push
  branch:
    - dev

node:
  environment: demoops

steps:
  - name: build-container
    image: docker:cli
    commands:
      - docker build
        -f Dockerfile
        --build-arg VCS_REFERENCE=${DRONE_COMMIT}
        --build-arg BUILD_VERSION_REFERENCE=${DRONE_BRANCH}
        -t iqkv/tg-airticket-notifier:latest
        .

  - name: deploy
    image: docker:cli
    depends_on:
      - build-container
    commands:
      - docker compose -f /app/compose.yaml -p app up -d --no-build cloud-vps-20-tg-airticket-notifier
