
# ============================================================================
# Pipeline: BuildImageShortlisty
# ============================================================================
# Same flow as BuildImage but targets the VDS Shortlisty stack.
# Triggers: Push to dev branch only
#
# The scraper is a run-to-completion batch job (no HTTP surface, output goes to
# /data on the host), so the compose service it deploys is a scheduled/one-shot
# container rather than a long-lived worker.
# ============================================================================
kind: pipeline
name: BuildImageShortlisty
type: docker

trigger:
  event:
    - push
  branch:
    - dev

node:
  environment: shortlisty

steps:
  - name: build-container
    image: docker:cli
    commands:
      - docker build
        -f Dockerfile
        --build-arg VCS_REFERENCE=${DRONE_COMMIT}
        --build-arg BUILD_VERSION_REFERENCE=${DRONE_BRANCH}
        --build-arg INSTALL_PLAYWRIGHT=0
        -t iqkv/docintelligence-mc-ingest-tagvenue-scraper:latest
        .

  - name: deploy
    image: docker:cli
    depends_on:
      - build-container
    commands:
      - docker compose -f /app/compose.yaml -p app up -d --no-build xeon-dual-mc-ingest-tagvenue-scraper

---
# ============================================================================
# Pipeline: ScheduledScrape
# ============================================================================
# Runs the scrape batch on the schedule registered in Drone (repository →
# Settings → Cron Jobs, or the CLI command below). The job name here must match
# the registered one, and the cron expression is 6-field and evaluated in UTC.
# Reuses the image built by BuildImageShortlisty — cron runs do not rebuild.
#
#   drone cron add --branch dev IQKV/docintelligence-mc-ingest-tagvenue-scraper \
#     tagvenue-nightly "0 30 2 * * *"
# ============================================================================
kind: pipeline
name: ScheduledScrape
type: docker

trigger:
  event:
    - cron
  cron:
    - tagvenue-nightly

node:
  environment: shortlisty

steps:
  - name: scrape
    image: docker:cli
    commands:
      - docker compose -f /app/compose.yaml -p app run --rm xeon-dual-mc-ingest-tagvenue-scraper
